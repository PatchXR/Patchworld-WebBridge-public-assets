<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Feed — Public Assets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0f0f23 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-y: auto;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560, #4a90e2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e94560;
            animation: pulse-dot 1.5s infinite;
        }

        .live-dot.connected {
            background: #4CAF50;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .header-stats {
            font-size: 12px;
            color: #888;
        }

        .header-stats span {
            color: #4a90e2;
            font-weight: 600;
        }

        /* ── Status Bar ── */
        .status-bar {
            padding: 6px 16px;
            font-size: 11px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-bar .connection {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-bar .connection.ok { color: #4CAF50; }
        .status-bar .connection.waiting { color: #f39c12; }
        .status-bar .connection.off { color: #e94560; }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            gap: 0;
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .tab {
            flex: 1;
            padding: 8px 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #888;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }

        .tab:hover { color: #ccc; }
        .tab.active {
            color: #e94560;
            border-bottom-color: #e94560;
        }

        .tab .count {
            display: inline-block;
            background: rgba(233,69,96,0.2);
            color: #e94560;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 8px;
            margin-left: 4px;
        }

        /* ── Content Panels ── */
        .panel {
            display: none;
            padding: 12px;
        }

        .panel.active {
            display: block;
        }

        /* ── Asset Grid ── */
        .asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .asset-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: all 0.2s;
            aspect-ratio: 1;
        }

        .asset-card:hover {
            border-color: rgba(233,69,96,0.5);
            transform: scale(1.03);
            box-shadow: 0 4px 20px rgba(233,69,96,0.2);
        }

        .asset-card.spawning {
            border-color: #4CAF50;
            animation: spawn-flash 0.6s ease-out;
        }

        @keyframes spawn-flash {
            0% { box-shadow: 0 0 0 0 rgba(76,175,80,0.6); }
            100% { box-shadow: 0 0 20px 4px rgba(76,175,80,0); }
        }

        .asset-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .asset-card .badge-new {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #e94560;
            color: white;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
            animation: pulse-dot 2s infinite;
        }

        .asset-card .type-badge {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0,0,0,0.7);
            color: #ccc;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        /* Audio card variant */
        .asset-card.audio {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(74,144,226,0.15), rgba(233,69,96,0.1));
        }

        .asset-card.audio .audio-icon {
            font-size: 32px;
            margin-bottom: 6px;
        }

        .asset-card.audio .audio-name {
            font-size: 10px;
            color: #aaa;
            text-align: center;
            padding: 0 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        /* ── Text Feed ── */
        .text-feed {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .text-message {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .text-message:hover {
            border-color: rgba(74,144,226,0.5);
            background: rgba(74,144,226,0.08);
        }

        .text-message.sent {
            border-color: #4CAF50;
        }

        .text-message .text-content {
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .text-message .text-meta {
            font-size: 10px;
            color: #666;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .text-message .send-hint {
            font-size: 10px;
            color: #4a90e2;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .text-message:hover .send-hint {
            opacity: 1;
        }

        /* ── All Feed ── */
        .all-feed {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .feed-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .feed-item:hover {
            border-color: rgba(233,69,96,0.4);
            background: rgba(255,255,255,0.06);
        }

        .feed-item .thumb {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .feed-item .thumb-placeholder {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .feed-item .thumb-placeholder.audio-ph {
            background: linear-gradient(135deg, rgba(74,144,226,0.2), rgba(233,69,96,0.15));
        }

        .feed-item .thumb-placeholder.text-ph {
            background: linear-gradient(135deg, rgba(76,175,80,0.2), rgba(74,144,226,0.15));
        }

        .feed-item .feed-info {
            flex: 1;
            overflow: hidden;
        }

        .feed-item .feed-type {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .feed-item .feed-type.image { color: #e94560; }
        .feed-item .feed-type.audio { color: #4a90e2; }
        .feed-item .feed-type.text { color: #4CAF50; }

        .feed-item .feed-name {
            font-size: 12px;
            color: #aaa;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .feed-item .feed-time {
            font-size: 10px;
            color: #555;
            flex-shrink: 0;
        }

        .feed-item .badge-new {
            background: #e94560;
            color: white;
            font-size: 8px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 3px;
            margin-left: 4px;
            animation: pulse-dot 2s infinite;
        }

        /* ── Empty States ── */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #555;
        }

        .empty-state .emoji {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 13px;
        }

        /* ── Audio Player Mini ── */
        .audio-player-mini {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 8px;
        }

        .audio-player-mini button {
            background: #4a90e2;
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-player-mini .audio-label {
            font-size: 11px;
            color: #aaa;
            flex: 1;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { border-color: #4CAF50; }
        .toast.info { border-color: #4a90e2; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="live-dot" id="liveDot"></div>
            <h1>Live Feed 🎤</h1>
        </div>
        <div class="header-stats">
            <select id="envSelect" style="background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #444; border-radius: 4px; padding: 2px 5px; font-size: 10px; margin-right: 10px;" onchange="onEnvChange()">
                <option value="https://api.patchxr.io">Prod API</option>
                <option value="https://dev.patchxr.io">Dev API</option>
            </select>
            <span id="totalCount">0</span> contributions
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="connection waiting" id="connectionStatus">
            ⏳ Waiting for PatchWorld...
        </div>
        <div id="uploadStatus" style="color: #888;">—</div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" data-tab="all" id="tabAll">
            All <span class="count" id="countAll">0</span>
        </button>
        <button class="tab" data-tab="media" id="tabMedia">
            📸 Media <span class="count" id="countMedia">0</span>
        </button>
        <button class="tab" data-tab="texts" id="tabTexts">
            💬 Texts <span class="count" id="countTexts">0</span>
        </button>
    </div>

    <!-- All Feed Panel -->
    <div class="panel active" id="panelAll">
        <div class="all-feed" id="allFeed">
            <div class="empty-state">
                <div class="emoji">📡</div>
                <p>Waiting for audience contributions...</p>
            </div>
        </div>
    </div>

    <!-- Media Panel (Images + Audio) -->
    <div class="panel" id="panelMedia">
        <div class="asset-grid" id="assetGrid">
            <div class="empty-state" style="grid-column: 1 / -1;">
                <div class="emoji">📸</div>
                <p>No images or audio yet...</p>
            </div>
        </div>
    </div>

    <!-- Texts Panel -->
    <div class="panel" id="panelTexts">
        <div class="text-feed" id="textFeed">
            <div class="empty-state">
                <div class="emoji">💬</div>
                <p>No text messages yet...</p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Hidden audio element for previewing audio assets -->
    <audio id="audioPreview" style="display:none;"></audio>

    <!-- PatchWorld Bridge -->
    <script>
        document.write('<script src="patchworld-bridge.js?t=' + Date.now() + '"><\/script>');
    </script>

    <script>
        // ── Config ──
        const POLL_INTERVAL_MS = 5000;
        const NEW_THRESHOLD_MS = 30000; // Assets younger than 30s get "NEW" badge

        // ── State ──
        let knownAssetIds = new Set();
        let knownTextIds = new Set();
        let allAssets = [];
        let allTexts = [];
        let isConnected = false;
        let pollTimer = null;
        let currentTab = 'all';
        let currentAudioSrc = null;

        // ── PatchWorld Lifecycle ──
        PatchWorld.onBeforeData = function() {
            document.getElementById('connectionStatus').innerHTML = '🔄 Connecting...';
            document.getElementById('connectionStatus').className = 'connection waiting';
        };

        PatchWorld.onData = function(context) {
            isConnected = true;
            document.getElementById('connectionStatus').innerHTML = '✅ Connected to ' + (context.worldId || 'PatchWorld');
            document.getElementById('connectionStatus').className = 'connection ok';
            document.getElementById('liveDot').classList.add('connected');

            // Start polling
            fetchRecent();
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(fetchRecent, POLL_INTERVAL_MS);
        };

        PatchWorld.onWorldReady = function() {
            document.getElementById('connectionStatus').innerHTML = '✅ World Ready — Live!';
        };

        PatchWorld.onDisconnected = function() {
            isConnected = false;
            document.getElementById('connectionStatus').innerHTML = '❌ Disconnected';
            document.getElementById('connectionStatus').className = 'connection off';
            document.getElementById('liveDot').classList.remove('connected');
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        };

        // ── API ──
        function onEnvChange() {
            // Reset state when switching environments
            knownAssetIds.clear();
            knownTextIds.clear();
            allAssets = [];
            allTexts = [];
            document.getElementById('totalCount').innerText = '0';
            document.getElementById('countAll').innerText = '0';
            document.getElementById('countMedia').innerText = '0';
            document.getElementById('countTexts').innerText = '0';
            renderAll();
            renderMedia();
            renderTexts();
            fetchRecent();
        }

        async function fetchRecent() {
            try {
                const API_URL = document.getElementById('envSelect').value;
                const res = await fetch(`${API_URL}/public-uploads/recent?limit=20`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                // Track new items
                let newAssetCount = 0;
                let newTextCount = 0;

                if (data.assets) {
                    data.assets.forEach(a => {
                        if (!knownAssetIds.has(a._id)) {
                            knownAssetIds.add(a._id);
                            newAssetCount++;
                        }
                    });
                    allAssets = data.assets;
                }

                if (data.texts) {
                    data.texts.forEach(t => {
                        if (!knownTextIds.has(t._id)) {
                            knownTextIds.add(t._id);
                            newTextCount++;
                        }
                    });
                    allTexts = data.texts;
                }

                // Update status
                if (data.enabled) {
                    document.getElementById('uploadStatus').innerHTML = '🟢 Uploads open';
                    document.getElementById('uploadStatus').style.color = '#4CAF50';
                } else {
                    document.getElementById('uploadStatus').innerHTML = '🔴 Uploads closed';
                    document.getElementById('uploadStatus').style.color = '#e94560';
                }

                // Update counts
                const totalCount = allAssets.length + allTexts.length;
                document.getElementById('totalCount').innerText = totalCount;
                document.getElementById('countAll').innerText = totalCount;
                document.getElementById('countMedia').innerText = allAssets.length;
                document.getElementById('countTexts').innerText = allTexts.length;

                // Render
                renderAll();
                renderMedia();
                renderTexts();

                // Notify on new items
                if (newAssetCount > 0) {
                    showToast(`📸 ${newAssetCount} new ${newAssetCount === 1 ? 'asset' : 'assets'}!`, 'info');
                } else if (newTextCount > 0) {
                    showToast(`💬 ${newTextCount} new ${newTextCount === 1 ? 'message' : 'messages'}!`, 'info');
                }

            } catch (err) {
                console.error('[LiveFeed] Fetch error:', err.message);
            }
        }

        // ── Helpers ──
        function timeAgo(dateStr) {
            const diff = Date.now() - new Date(dateStr).getTime();
            if (diff < 5000) return 'just now';
            if (diff < 60000) return Math.floor(diff / 1000) + 's ago';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
            return Math.floor(diff / 3600000) + 'h ago';
        }

        function isNew(dateStr) {
            return (Date.now() - new Date(dateStr).getTime()) < NEW_THRESHOLD_MS;
        }

        function isImage(asset) {
            return asset.fileType === 'Image' || asset.category === 'Image';
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `toast ${type} visible`;
            setTimeout(() => { toast.className = 'toast'; }, 2500);
        }

        // ── Spawn Asset ──
        async function spawnAsset(assetId) {
            if (!isConnected) {
                showToast('⚠️ Not connected to PatchWorld', 'info');
                return;
            }

            // Visual feedback
            const cards = document.querySelectorAll(`[data-asset-id="${assetId}"]`);
            cards.forEach(c => c.classList.add('spawning'));
            setTimeout(() => cards.forEach(c => c.classList.remove('spawning')), 600);

            try {
                const fullId = await runCommand("SpawnAssetAndGetID", assetId);
                showToast(`✅ Spawned! (${fullId})`, 'success');
                console.log('[LiveFeed] Spawned asset:', assetId, '→', fullId);
            } catch (err) {
                showToast(`❌ Spawn failed: ${err}`, 'info');
                console.error('[LiveFeed] Spawn error:', err);
            }
        }

        // ── Send Text to Scene ──
        async function sendTextToScene(text) {
            if (!isConnected) {
                showToast('⚠️ Not connected to PatchWorld', 'info');
                return;
            }
            try {
                await PatchWorld.interfaceMessageOut(text);
                showToast(`✅ Text sent to scene!`, 'success');
            } catch (err) {
                showToast(`❌ Send failed: ${err}`, 'info');
            }
        }

        // ── Audio Preview ──
        function toggleAudio(url, btn) {
            const audio = document.getElementById('audioPreview');
            if (currentAudioSrc === url && !audio.paused) {
                audio.pause();
                btn.innerText = '▶';
                currentAudioSrc = null;
            } else {
                audio.src = url;
                audio.play();
                currentAudioSrc = url;
                btn.innerText = '⏸';
                audio.onended = () => { btn.innerText = '▶'; currentAudioSrc = null; };
            }
        }

        // ── Render: All Feed ──
        function renderAll() {
            const container = document.getElementById('allFeed');

            // Merge assets and texts into a unified chronological feed
            const items = [];

            allAssets.forEach(a => {
                items.push({
                    type: isImage(a) ? 'image' : 'audio',
                    id: a._id,
                    date: a.createdAt,
                    asset: a
                });
            });

            allTexts.forEach(t => {
                items.push({
                    type: 'text',
                    id: t._id,
                    date: t.createdAt,
                    text: t
                });
            });

            // Sort by date descending (newest first)
            items.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="emoji">📡</div><p>Waiting for audience contributions...</p></div>';
                return;
            }

            let html = '';
            items.forEach(item => {
                const newBadge = isNew(item.date) ? '<span class="badge-new">NEW</span>' : '';
                const time = timeAgo(item.date);

                if (item.type === 'image') {
                    html += `
                        <div class="feed-item" data-asset-id="${item.asset._id}" onclick="spawnAsset('${item.asset._id}')">
                            <img class="thumb" src="${item.asset.thumbUrl || item.asset.url}" alt="" loading="lazy">
                            <div class="feed-info">
                                <div class="feed-type image">📸 Image ${newBadge}</div>
                                <div class="feed-name">${item.asset.file || 'Photo'}</div>
                            </div>
                            <div class="feed-time">${time}</div>
                        </div>`;
                } else if (item.type === 'audio') {
                    html += `
                        <div class="feed-item" data-asset-id="${item.asset._id}" onclick="spawnAsset('${item.asset._id}')">
                            <div class="thumb-placeholder audio-ph">🎵</div>
                            <div class="feed-info">
                                <div class="feed-type audio">🎤 Audio ${newBadge}</div>
                                <div class="feed-name">${item.asset.file || 'Recording'}</div>
                            </div>
                            <div class="feed-time">${time}</div>
                        </div>`;
                } else if (item.type === 'text') {
                    const textVal = (item.text.value && item.text.value.text) ? item.text.value.text : JSON.stringify(item.text.value);
                    const truncated = textVal.length > 80 ? textVal.substring(0, 80) + '…' : textVal;
                    html += `
                        <div class="feed-item" onclick="sendTextToScene('${textVal.replace(/'/g, "\\'")}')">
                            <div class="thumb-placeholder text-ph">💬</div>
                            <div class="feed-info">
                                <div class="feed-type text">💬 Text ${newBadge}</div>
                                <div class="feed-name">${truncated}</div>
                            </div>
                            <div class="feed-time">${time}</div>
                        </div>`;
                }
            });

            container.innerHTML = html;
        }

        // ── Render: Media Grid ──
        function renderMedia() {
            const container = document.getElementById('assetGrid');

            if (allAssets.length === 0) {
                container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="emoji">📸</div><p>No images or audio yet...</p></div>';
                return;
            }

            let html = '';
            allAssets.forEach(a => {
                const newBadge = isNew(a.createdAt) ? '<div class="badge-new">NEW</div>' : '';

                if (isImage(a)) {
                    html += `
                        <div class="asset-card" data-asset-id="${a._id}" onclick="spawnAsset('${a._id}')">
                            <img src="${a.thumbUrl || a.url}" alt="${a.file || 'Photo'}" loading="lazy">
                            ${newBadge}
                            <div class="type-badge">📸 Tap to spawn</div>
                        </div>`;
                } else {
                    html += `
                        <div class="asset-card audio" data-asset-id="${a._id}" onclick="spawnAsset('${a._id}')">
                            <div class="audio-icon">🎵</div>
                            <div class="audio-name">${a.file || 'Recording'}</div>
                            ${newBadge}
                            <div class="type-badge">🎤 Tap to spawn</div>
                        </div>`;
                }
            });

            container.innerHTML = html;
        }

        // ── Render: Text Feed ──
        function renderTexts() {
            const container = document.getElementById('textFeed');

            if (allTexts.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="emoji">💬</div><p>No text messages yet...</p></div>';
                return;
            }

            let html = '';
            allTexts.forEach(t => {
                const textVal = (t.value && t.value.text) ? t.value.text : JSON.stringify(t.value);
                const escapedText = textVal.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const time = timeAgo(t.createdAt);
                const newClass = isNew(t.createdAt) ? ' style="border-color: rgba(74,144,226,0.3);"' : '';

                html += `
                    <div class="text-message" onclick="sendTextToScene('${escapedText}')"${newClass}>
                        <div class="text-content">${textVal}</div>
                        <div class="text-meta">
                            <span>${time}</span>
                            <span class="send-hint">🔊 Tap to send to scene</span>
                        </div>
                    </div>`;
            });

            container.innerHTML = html;
        }

        // ── Tab Switching ──
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

                tab.classList.add('active');
                const tabId = tab.dataset.tab;
                document.getElementById('panel' + tabId.charAt(0).toUpperCase() + tabId.slice(1)).classList.add('active');
                currentTab = tabId;
            });
        });

        // ── Fallback: Start polling even without PatchWorld bridge (for browser testing) ──
        setTimeout(() => {
            if (!isConnected) {
                console.log('[LiveFeed] No PatchWorld bridge detected — starting polling in standalone mode.');
                document.getElementById('connectionStatus').innerHTML = '🌐 Standalone mode (no VR)';
                document.getElementById('connectionStatus').className = 'connection waiting';
                fetchRecent();
                if (!pollTimer) pollTimer = setInterval(fetchRecent, POLL_INTERVAL_MS);
            }
        }, 3000);
    </script>

</body>
</html>
